# NimbusXR status page, one page for every NimbusXR product. Upptime:
# GitHub Actions check the endpoints, commit the results, and publish the
# site to GitHub Pages at status.nimbusxr.us.
# Docs: https://upptime.js.org/docs/configuration
owner: nimbusxr
repo: status

# One row per public endpoint, named "Product · Service". Shout!'s
# /health answers 200 with {"status":"ok","version":…} on both services.
# Production rows go in when production exists; until then the page
# watches staging, and says so. Other products add their rows here.
sites:
  - name: Shout! · Website (staging)
    url: https://shout-dev.nimbusxr.us/health
    icon: https://storage.googleapis.com/nimbusxr-shout-assets/logo-128.png
    maxResponseTime: 3000
  - name: Shout! · Chat service (staging)
    url: https://shout-internal.nimbusxr.cloud/health
    icon: https://storage.googleapis.com/nimbusxr-shout-assets/logo-128.png
    maxResponseTime: 3000

# Incidents are GitHub issues; assign them so GitHub emails on open/close.
assignees:
  - joshuaNathaniel

workflowSchedule:
  uptime: "*/5 * * * *"        # every 5 minutes (GitHub's cron is best-effort)
  response-time: "0 */6 * * *" # response-time graphs four times a day
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  static-site: "0 1 * * *"

status-website:
  cname: status.nimbusxr.us
  name: NimbusXR status
  introTitle: "**NimbusXR** status"
  introMessage: "Live checks of every NimbusXR service every five minutes, with 90 days of history, and incidents as they happen. Each row is a product and one of its services. Shout! support: [shout.nimbusxr.us/support](https://shout.nimbusxr.us/support)."
  navbar:
    - title: Status
      href: /
    - title: NimbusXR
      href: https://nimbusxr.us
    - title: Shout!
      href: https://shout.nimbusxr.us
  metaTags:
    - name: description
      content: Live status of NimbusXR services
    - name: robots
      content: noindex
  theme: light
