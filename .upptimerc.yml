# Shout! status page. Upptime: GitHub Actions check the endpoints, commit
# the results, and publish the site to GitHub Pages at status.nimbusxr.us.
# Docs: https://upptime.js.org/docs/configuration
owner: nimbusxr
repo: status

# One row per public endpoint. /health answers 200 with {"status":"ok",
# "version":…} on both services. Production rows go here when it exists;
# until then the page watches staging, and says so.
sites:
  - name: Website (staging)
    url: https://shout-dev.nimbusxr.us/health
    icon: https://storage.googleapis.com/nimbusxr-shout-assets/logo-128.png
    maxResponseTime: 3000
  - name: Chat service (staging)
    url: https://shout-internal.nimbusxr.cloud/health
    icon: https://storage.googleapis.com/nimbusxr-shout-assets/logo-128.png
    maxResponseTime: 3000

# Incidents are GitHub issues; assign them so GitHub emails on open/close.
assignees:
  - joshuaNathaniel

workflowSchedule:
  uptime: "*/5 * * * *"        # every 5 minutes (GitHub's cron is best-effort)
  response-time: "0 */6 * * *" # response-time graphs four times a day
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  static-site: "0 1 * * *"

status-website:
  cname: status.nimbusxr.us
  name: Shout! status
  logoUrl: https://storage.googleapis.com/nimbusxr-shout-assets/logo-256.png
  introTitle: "**Shout!** status"
  introMessage: "Live checks of the Shout! website and the Chat service every five minutes, with 90 days of history. Incidents are posted here as they happen. Support: [shout.nimbusxr.us/support](https://shout.nimbusxr.us/support)."
  navbar:
    - title: Status
      href: /
    - title: Shout!
      href: https://shout.nimbusxr.us
    - title: Help
      href: https://shout.nimbusxr.us/help
    - title: Support
      href: https://shout.nimbusxr.us/support
  metaTags:
    - name: description
      content: Live status of Shout! for Google Chat
    - name: robots
      content: noindex
  theme: light
